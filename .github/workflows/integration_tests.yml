name: integration tests

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      run_live_object_store:
        description: Run the credential-gated Ceph/S3 smoke test
        required: false
        default: false
        type: boolean

jobs:
  build:
    runs-on: ubuntu-latest
    name: integration tests (Python ${{ matrix.python-version }})
    strategy:
      matrix:
        python-version: ["3.9", "3.12"]
    steps:
    - uses: actions/checkout@v4
    - name: Build and run deterministic test container
      run: make test-docker PYTHON_VERSION=${{ matrix.python-version }}
    - name: Upload coverage reports to Codecov
      uses: codecov/codecov-action@v4.0.1
      with:
        token: ${{ secrets.CODECOV_TOKEN }}
        slug: NeurodataWithoutBorders/lindi

  live-object-store:
    if: github.event_name == 'workflow_dispatch' && inputs.run_live_object_store
    runs-on: ubuntu-latest
    environment: live-object-store-tests
    env:
      LINDI_LIVE_REFERENCE_URL: ${{ secrets.LINDI_LIVE_REFERENCE_URL }}
      LINDI_LIVE_DATASET_PATH: ${{ vars.LINDI_LIVE_DATASET_PATH }}
    steps:
    - uses: actions/checkout@v4
    - name: Run live Ceph/S3 smoke test
      run: make test-live-object-store-docker PYTHON_VERSION=3.12
