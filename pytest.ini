[pytest]
testpaths = tests
addopts = --verbose --strict-config --strict-markers -m "not network and not live_object_store"
log_cli = true
log_cli_level = INFO
markers =
    slow: marks tests as slow (deselect with '-m "not slow"')
    network: marks tests as network (deselect with '-m "not network"')
    live_object_store: marks tests that require an explicitly configured live Ceph/S3 fixture
